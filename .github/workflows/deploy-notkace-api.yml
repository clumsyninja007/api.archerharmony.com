name: Deploy Notkace API

on:
  push:
    branches:
      - main
    paths:
      - 'Notkace.Api/**'
      - '.github/workflows/deploy-notkace-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # push image to GHCR
  id-token: write      # OIDC login to Azure

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/notkace-api
  CONTAINERAPP_NAME: ca-notkace-api
  RESOURCE_GROUP: rg-hoelterling

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Notkace.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll Container App to the new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "$CONTAINERAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${IMAGE}:${{ github.sha }}"
